[workspace]
members = ["src-tauri"]

[package]
name = "rusi"
version = "0.1.0"
edition = "2024"
description = "Host em Rust para agentes de código que reutiliza as assinaturas do usuário (Claude, ChatGPT, Google, Cursor, Muse)"
authors = ["Joao"]

[dependencies]
# Runtime Assíncrono
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# CLI & Argumentos
clap = { version = "4.5", features = ["derive", "env"] }

# HTTP (downloads gerenciados de CLIs)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialização & JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"


# Terminal & Interface
colored = "3.0"
dirs = "7.0.0"
dotenvy = "0.15.7"
thiserror = "2.0.21"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.28.0", features = ["v4", "v7"] }
keyring = "4.2.0"

[dependencies.url]
version = "2.5"

[dependencies.zip]
version = "3"
features = ["deflate"]

[dependencies.sha2]
version = "0.10"

[dev-dependencies]
tempfile = "3.27.0"
